<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel 3: Debate e intercambio de ideas - Entre voces</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Roboto:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/nivel_3.css">
</head>
<body>

    <!-- Ícono de avatar reutilizable -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="icono-avatar" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="47" fill="#000" stroke="#fff" stroke-width="3"/>
            <circle cx="50" cy="38" r="15" fill="#fff"/>
            <path d="M20 84c4-16 17-24 30-24s26 8 30 24a47 47 0 01-60 0z" fill="#fff"/>
        </symbol>
    </svg>

    <!-- Decoración de fondo -->
    <div class="blob-derecho" aria-hidden="true"></div>

    <svg class="deco-estrellas" viewBox="0 0 150 150" aria-hidden="true">
        <path d="M45 20l8 17 19 2-14 13 4 19-17-10-17 10 4-19-14-13 19-2z" fill="#fff0b8" stroke="#f3dc8a" stroke-width="2" stroke-linejoin="round" transform="translate(10 40) scale(1.1)"/>
        <path d="M45 20l8 17 19 2-14 13 4 19-17-10-17 10 4-19-14-13 19-2z" fill="#fed87f" stroke="#f0c85a" stroke-width="2" stroke-linejoin="round" transform="translate(52 62) scale(1)"/>
        <path d="M110 8l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fff0b8"/>
        <path d="M128 70l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff0b8"/>
        <path d="M120 125l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fed87f"/>
    </svg>

    <img class="deco-tele" src="assets/img/television.png" alt="" aria-hidden="true">

    <!-- ENCABEZADO -->
    <header class="nivel-header">
        <span class="nivel-badge">
            <svg class="badge-burbujas" viewBox="0 0 60 44" aria-hidden="true">
                <path d="M22 3C11 3 3 10 3 19c0 5 3 9 7 12l-2 8 10-6c1 .2 3 .3 4 .3 11 0 19-7 19-16S33 3 22 3z" fill="#fff0b8" stroke="#d9b94c" stroke-width="2"/>
                <path d="M38 14c-8 0-14 5-14 12s6 12 14 12c1 0 2 0 3-.3l8 5-2-7c4-2 6-6 6-10 0-7-7-12-15-12z" fill="#fed87f" stroke="#d9b94c" stroke-width="2" transform="translate(-2 -2) scale(.9)"/>
            </svg>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6L2.5 9.5l6.6-.8z"
                      fill="#f2b705" stroke="#c98f00" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            Nivel 3
        </span>

        <h1>Debate e intercambio de ideas</h1>

        <p class="nivel-descripcion">
            ¡Increíble! Ya estás preparado para argumentar de forma respetuosa
            y segura frente a otros. ¡Adelante!
        </p>
    </header>

    <!-- VIDEOLLAMADA -->
    <main class="escena">
        <section class="llamada" aria-label="Videollamada">

            <div class="llamada-pantalla">
                <div class="participante">
                    <div class="participante-video">
                        <svg class="avatar-llamada"><use href="#icono-avatar"/></svg>
                    </div>
                    <span class="participante-nombre">usuario2006</span>
                </div>

                <div class="participante">
                    <div class="participante-video">
                        <svg class="avatar-llamada"><use href="#icono-avatar"/></svg>
                    </div>
                    <span class="participante-nombre">usuario2006</span>
                </div>

                <!-- Tu cámara (aparece solo si la activas) -->
                <div class="mi-camara" id="mi-camara" hidden>
                    <video id="video-local" autoplay playsinline muted></video>
                    <span class="participante-nombre">usuario1020</span>
                </div>
            </div>

            <!-- Barra de controles -->
            <div class="llamada-barra">
                <div class="controles">
                    <!-- BOTON PARA ABRIR EL MICRÓFONO -->
                    <button type="button" id="btn-mic" class="ctrl" aria-pressed="false" aria-label="Silenciar micrófono">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="2" width="6" height="12" rx="3"/>
                            <path d="M5 11a7 7 0 0014 0M12 18v4M8 22h8"/>
                            <line class="tachado" x1="3" y1="3" x2="21" y2="21"/>
                        </svg>
                    </button>
                    <!-- BOTON PARA ABRIR LA CÁMARA -->
                    <button type="button" id="btn-camara" class="ctrl" aria-pressed="false" aria-label="Activar cámara">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 7h3l1.5-2.5h7L17 7h3a1 1 0 011 1v11a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z"/>
                            <circle cx="12" cy="13" r="3.8"/>
                            <line class="tachado" x1="3" y1="3" x2="21" y2="21"/>
                        </svg>
                    </button>
                </div>
                    <!-- BOTON PARA ABRIR FINALIZAR LLAMADA-->
                <button type="button" id="btn-colgar" class="ctrl ctrl-colgar" aria-label="Terminar llamada">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path transform="rotate(135 12 12)" d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                </button>

                <div class="barra-derecha">
                    <span class="participante-nombre">usuario1020</span>
                    <button type="button" class="ctrl" aria-label="Más opciones">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <p id="estado-camara" class="estado" role="status"></p>
    </main>

    <img class="deco-chico" src="assets/img/chico_celebrando.png" alt="" aria-hidden="true">

    <!-- Botón volver -->
    <button id="btn-atras" class="btn-volver" aria-label="Volver atras">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="20" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Volver</span>
    </button>

    <!-- Botón siguiente -->
    <a href="retroalimentacion.html" id="btn-siguiente" class="btn-volver btn-siguiente">
        <span>Siguiente</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
    </a>

    <script src="assets/js/nivel_3.js"></script>
    
</body>
</html>
