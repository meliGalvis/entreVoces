<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retroalimentación - Entre voces</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Roboto:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/retroalimentacion.css">
</head>
<body>

    <div class="franja-superior" aria-hidden="true"></div>

    <main class="escena">

        <!-- COLUMNA IZQUIERDA: título y chica -->
        <section class="columna-izq">
            <div class="badge-retro">
                <img class="badge-pulgar" src="assets/img/pulgar.png" alt="" aria-hidden="true">

                <h1>
                    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6L2.5 9.5l6.6-.8z"
                              fill="#8c5aa6" stroke="#6b3f85" stroke-width="1.4" stroke-linejoin="round"/>
                    </svg>
                    Retroalimentación
                </h1>

                <svg class="badge-destellos" viewBox="0 0 30 40" aria-hidden="true" stroke="#8c5aa6" stroke-width="2.5" stroke-linecap="round">
                    <line x1="4" y1="10" x2="14" y2="14"/>
                    <line x1="2" y1="22" x2="14" y2="22"/>
                    <line x1="4" y1="34" x2="14" y2="30"/>
                </svg>
            </div>

            <img class="deco-chica" src="assets/img/chica_pulgar.png" alt="Ilustración de una chica con el pulgar arriba">
        </section>

        <!-- COLUMNA DERECHA: resultados y recomendaciones -->
        <section class="columna-der">

            <div class="tarjeta-resultados">
                <h2 class="tarjeta-titulo">Tus respuestas nos cuentan cómo vas</h2>
                <img class="deco-copa" src="assets/img/copa.png" alt="" aria-hidden="true">

                <p class="dato"><strong>Tu desempeño:</strong> <span id="res-desempeno"></span>
                90%</p>
                <p class="dato"><strong>Puntaje:</strong> <span id="res-puntaje"></span>
                90/100</p>
                <p class="dato"><strong>Trabajo:</strong> <span id="res-trabajo"></span>
                90%</p>
            </div>

            <p class="recomienda">Según tu proceso, te recomendamos:</p>

            <div class="caja-recomendaciones" id="res-recomendaciones" aria-live="polite">
                Aqui irán las indicaciones de retroalimentación según el desempeño del usuario.
            </div>
        </section>
    </main>

    <!-- Botón volver -->
    <button id="btn-atras" class="btn-volver" aria-label="Volver al menú">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="20" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Volver</span>
    </button>

    <!-- Botón finalizar -->
    <a href="menu.html" id="btn-siguiente" class="btn-volver btn-siguiente">
        <span>Finalizar</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
    </a>

    <script>
        
    </script>
</body>
</html>
